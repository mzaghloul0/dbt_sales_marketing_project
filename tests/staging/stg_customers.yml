version: 2

models:
  - name: stg_customers
    description: >
      Cleaned customers, one row per customer.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "phone = 'Unknown' OR phone ~ '^[+]1[0-9]{10}(x[0-9]+)?$'"
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: gender
        data_tests:
          - accepted_values:
              arguments:
                values: ['M', 'F', 'D', 'Unknown']
      - name: preferred_channel
        data_tests:
          - accepted_values:
              arguments:
                values: ['Online', 'In-Store', 'Both', 'Unknown']
      - name: age
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 18
                max_value: 120
      - name: state_code
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_states')
                field: state_code