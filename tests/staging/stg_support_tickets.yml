version: 2

models:
  - name: stg_support_tickets
    description: >
      Cleaned customer support tickets.
    columns:
      - name: ticket_id
        data_tests:
          - unique
          - not_null
      - name: priority
        data_tests:
          - accepted_values:
              arguments:
                values: ['Low', 'Medium', 'High', 'Unknown']
      - name: resolution_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['Resolved', 'Pending', 'Escalated', 'Closed without Resolution', 'Unknown']
      - name: satisfaction_score
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id