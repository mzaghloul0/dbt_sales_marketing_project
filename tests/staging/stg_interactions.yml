version: 2

models:
  - name: stg_interactions
    description: >
      Cleaned website, app and kiosk interactions.
    columns:
      - name: interaction_id
        data_tests:
          - unique
          - not_null
      - name: channel
        data_tests:
          - accepted_values:
              arguments:
                values: ['Web', 'Mobile App', 'In-Store Kiosk']
      - name: target_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['Page', 'Product', 'Unknown']
      - name: duration
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id