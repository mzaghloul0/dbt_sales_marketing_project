name: 'dbt_sales_marketing_project'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'dbt_sales_marketing_project'

vars:
  date_spine_start: "2019-01-01"
  date_spine_end: "2028-01-01"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

seeds:
    +schema: raw
    +full_refresh: true

models:
  dbt_sales_marketing_project:
    data_quality:
      +schema: data_quality
      +materialized: view

    staging:
      +materialized: table
      +schema: staging

    marts:
      +materialized: incremental
      +incremental_strategy: merge
      +on_schema_change: append_new_columns

      core:
        +schema: core
      marketing:
        +schema: marketing
      sales:
        +schema: sales
      support:
        +schema: support

